name: Split Bundles

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout monorepo
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for tags

      # 2. Split symfony-bundle to read-only repo
      - name: Split Symfony Bundle
        uses: danharrin/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.BUNDLE_SPLIT_TOKEN }}
        with:
          package_directory: 'packages/symfony-bundle'
          repository_organization: 'Paneon'
          repository_name: 'php-to-typescript-bundle'
          branch: 'main'
          tag: ${{ github.ref_name }}
          user_name: 'git-split[bot]'
          user_email: 'git-split[bot]@users.noreply.github.com'

      # 3. Create GitHub release on split repo (only for tags)
      - name: Create GitHub Release on Split Repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.BUNDLE_SPLIT_TOKEN }}
        run: |
          # Extract version from tag (remove 'v' prefix if present)
          VERSION="${{ github.ref_name }}"
          VERSION_NUMBER="${VERSION#v}"

          # Extract release notes from CHANGELOG.md
          # Find the section for this version and extract until the next version header
          RELEASE_NOTES=$(awk -v ver="$VERSION_NUMBER" '
            $0 ~ "^# " ver "$" { found=1; next }
            found && /^# [0-9]/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d')

          # If no release notes found, use a default message
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES=$(printf "Release %s\n\nSee the main repository for release notes: https://github.com/Paneon/php-to-typescript/releases/tag/%s" "$VERSION_NUMBER" "$VERSION")
          fi

          # Create release on the split repository
          gh release create "$VERSION" \
            --repo Paneon/php-to-typescript-bundle \
            --title "Symfony Bundle $VERSION" \
            --notes "$RELEASE_NOTES"
